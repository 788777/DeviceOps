# DeviceOps 一键启动：app + mysql + redis
#
#   docker compose up --build
#   -> http://127.0.0.1:8000/docs
#
# 变量来自同目录 .env（可选），没有 .env 时用下面 ${VAR:-默认值} 里的默认值。

name: deviceops

services:
  # ==================== 应用 ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络默认走清华 PyPI 镜像；改成 https://pypi.org/simple 可用官方源
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: deviceops-app:latest
    container_name: deviceops-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-DeviceOps}
      VERSION: ${VERSION:-0.1.0}
      DEBUG: ${DEBUG:-false}
      API_V1_PREFIX: /api/v1
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-please-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_FILE_NAME: ${LOG_FILE_NAME:-app.log}
      SQL_ECHO: ${SQL_ECHO:-false}
      # 容器内固定连 mysql 服务；切 SQLite 见文件末尾的注释
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-deviceops}:${MYSQL_PASSWORD:-deviceops123}@mysql:3306/${MYSQL_DATABASE:-deviceops}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
    volumes:
      # 日志持久化到 named volume：docker compose logs 之外还能直接看文件
      - app_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 curl（刻意不装 apt 包），用自带的 python 做健康检查
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - deviceops-net

  # ==================== MySQL ====================
  mysql:
    image: mysql:8.0
    container_name: deviceops-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-deviceops}
      MYSQL_USER: ${MYSQL_USER:-deviceops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-deviceops123}
      TZ: Asia/Shanghai
    ports:
      # 宿主机用 3307，避免和本机已装的 MySQL(3306) 冲突；容器内仍是 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - deviceops-net

  # ==================== Redis ====================
  # 目前应用只读取 REDIS_URL，还没有实际使用（留给后续缓存/任务队列阶段）；
  # 先跑起来是为了本地/生产环境一致：docker compose exec redis redis-cli ping
  redis:
    image: redis:7-alpine
    container_name: deviceops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - deviceops-net

volumes:
  mysql_data:
  redis_data:
  app_logs:

networks:
  deviceops-net:
    driver: bridge

# ==================== 想用 SQLite 跑容器？ ====================
# 把 app 的 DATABASE_URL 换成下面这行，并在 app 的 volumes 里加一个数据卷：
#
#   DATABASE_URL: sqlite:////data/deviceops.db
#   volumes:
#     - app_data:/data
#     - app_logs:/app/logs
# ...
# volumes:
#   app_data:
#
# 注意 SQLite 有 4 个斜杠：sqlite:////data/deviceops.db（绝对路径）。
